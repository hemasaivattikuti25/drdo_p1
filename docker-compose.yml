# ─────────────────────────────────────────────────────────────────────────────
# DRDO DAMS — Docker Compose
# Starts a 3-node MongoDB replica set + FastAPI backend + React frontend
#
# Usage:
#   docker compose up --build        → first run (builds images + starts)
#   docker compose up -d             → subsequent runs (background)
#   docker compose down -v           → stop and remove volumes
# ─────────────────────────────────────────────────────────────────────────────

# ── Shared replica-set network ─────────────────────────────────────────────────
networks:
  dams-net:
    driver: bridge

# ── Persistent data volumes ────────────────────────────────────────────────────
volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:


services:

  # ────────────────────────────────────────────────────────────────────────────
  # MongoDB Node 1 — PRIMARY (priority 3)
  # ────────────────────────────────────────────────────────────────────────────
  mongo1:
    image: mongo:6.0
    container_name: dams-mongo1
    restart: unless-stopped
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27017:27017"
    volumes:
      - mongo1-data:/data/db
    networks:
      - dams-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo1:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ────────────────────────────────────────────────────────────────────────────
  # MongoDB Node 2 — SECONDARY (priority 2)
  # ────────────────────────────────────────────────────────────────────────────
  mongo2:
    image: mongo:6.0
    container_name: dams-mongo2
    restart: unless-stopped
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27018:27017"
    volumes:
      - mongo2-data:/data/db
    networks:
      - dams-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo2:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ────────────────────────────────────────────────────────────────────────────
  # MongoDB Node 3 — SECONDARY (priority 1)
  # ────────────────────────────────────────────────────────────────────────────
  mongo3:
    image: mongo:6.0
    container_name: dams-mongo3
    restart: unless-stopped
    command: [ "mongod", "--replSet", "rs0", "--bind_ip_all" ]
    ports:
      - "27019:27017"
    volumes:
      - mongo3-data:/data/db
    networks:
      - dams-net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo3:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ────────────────────────────────────────────────────────────────────────────
  # Replica Set Initialiser (runs once, then exits)
  # ────────────────────────────────────────────────────────────────────────────
  mongo-init:
    image: mongo:6.0
    container_name: dams-mongo-init
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    command: >
      mongosh --host mongo1:27017 --file /scripts/mongo-init-replica.js
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - dams-net

  # ────────────────────────────────────────────────────────────────────────────
  # FastAPI Backend
  # ────────────────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dams-backend
    restart: unless-stopped
    depends_on:
      - mongo-init
    environment:
      MONGO_DEFAULT_MODE: replica
      MONGO_URI_REPLICA: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/drdo_dams?replicaSet=rs0
      MONGO_URI_STANDALONE: mongodb://mongo1:27017/drdo_dams
      JWT_SECRET: ${JWT_SECRET:-drdo_dams_change_this_in_production}
      JWT_EXPIRE_HOURS: ${JWT_EXPIRE_HOURS:-24}
      FRONTEND_URL: http://localhost:3000
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - dams-net
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────────────────────────────────────────
  # React Frontend (nginx)
  # ────────────────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dams-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - dams-net
